<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro RPE - Coach RVB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f3f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      width: 100%;
      max-width: 420px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .btn-back {
      background-color: #007bff;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background-color 0.2s;
    }

    .btn-back:hover {
      background-color: #0056b3;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #000000;
      text-align: right;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:read-only {
      background-color: #f8f9fa;
      color: #6c757d;
      cursor: not-allowed;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #28a745;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <button class="btn-back" id="btn-volver">← Volver</button>
      <h2 class="title">Registro RPE</h2>
    </div>
    
    <form id="form-rpe" onsubmit="enviarRPE(event)">
      
      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre (User)</label>
        <input type="text" id="nombre" readonly required placeholder="Cargando jugador...">
      </div>

      <div class="form-group">
        <label for="equiposel">Equipo</label>
        <input type="text" id="equiposel" readonly required placeholder="Cargando equipo...">
      </div>

      <div class="form-group">
        <label for="entrenamiento">Entrenamiento</label>
        <select id="entrenamiento" required>
          <option value="">Selecciona tipo</option>
          <option value="Pista">Pista</option>
          <option value="Físico">Físico</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rpe">RPE (0-10)</label>
        <input type="number" id="rpe" min="0" max="10" placeholder="0 a 10" required>
      </div>

      <div class="form-group">
        <label for="estatus">Estatus</label>
        <select id="estatus" required>
          <option value="Completo" selected>Completo</option>
          <option value="Ausente">Ausente</option>
          <option value="Limitado">Limitado</option>
          <option value="Lesionado">Lesionado</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" rows="3" placeholder="Observaciones..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Enviar</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Fecha actual por defecto
      document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

      // Lee estrictamente 'User' (jugador seleccionado en selector.js) y 'equipo'
      const jugadorSeleccionado = localStorage.getItem("User") || localStorage.getItem("jugadorSeleccionado");
      const equipoSeleccionado = localStorage.getItem("equipo") || localStorage.getItem("Equipo");

      if (jugadorSeleccionado) {
        document.getElementById('nombre').value = jugadorSeleccionado;
      }

      if (equipoSeleccionado) {
        document.getElementById('equiposel').value = equipoSeleccionado;
      }

      // Volver a selector.html
      document.getElementById('btn-volver').onclick = () => {
        window.location.href = "selector.html";
      };
    });

    function enviarRPE(event) {
      event.preventDefault();

      const rpeInput = document.getElementById('rpe');
      const rpeVal = parseInt(rpeInput.value, 10);
      
      if (isNaN(rpeVal) || rpeVal < 0 || rpeVal > 10) {
        alert("Comprueba valores de campos obligatorios (RPE debe ser de 0 a 10)");
        rpeInput.style.borderColor = "#dc3545";
        return;
      }
      rpeInput.style.borderColor = "#e1e4e8";

      const baseUrl = "https://docs.google.com/forms/d/1eca4eShUyVGaxiuB13ONX_dzXynArxuUQmtfFBx5veU/formResponse";
      const params = new URLSearchParams({
        "entry.1206689442": document.getElementById('fecha').value,
        "entry.1144883834": document.getElementById('nombre').value, // Envía 'User'
        "entry.697775640": document.getElementById('equiposel').value,
        "entry.1150680246": document.getElementById('entrenamiento').value,
        "entry.961295529": rpeVal,
        "entry.1650450183": document.getElementById('estatus').value,
        "entry.1691140284": document.getElementById('comentarios').value
      });

      fetch(`${baseUrl}?${params.toString()}`, { method: 'POST', mode: 'no-cors' })
        .then(() => {
          alert("RPE registrado con éxito");
          window.location.href = "selector.html";
        })
        .catch(error => {
          alert("Error al enviar los datos: " + error);
        });
    }
  </script>
</body>
</html>
