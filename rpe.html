<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro RPE - Coach RVB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f3f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      width: 100%;
      max-width: 420px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .btn-back {
      background-color: #20c997;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background-color 0.2s;
    }

    .btn-back:hover {
      background-color: #1ba87e;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #000000;
      text-align: right;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:read-only {
      background-color: #f8f9fa;
      color: #6c757d;
      cursor: not-allowed;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 3px rgba(32, 201, 151, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .rpe-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rpe-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #28a745 0%, #ffc107 50%, #dc3545 100%);
      outline: none;
      padding: 0;
      border: none;
      cursor: pointer;
    }

    .rpe-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #333;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .rpe-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #333;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .rpe-value {
      font-size: 18px;
      font-weight: 800;
      min-width: 28px;
      text-align: center;
      color: #1a1a1a;
    }

    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit,
    .btn-menu {
      flex: 1;
      padding: 13px;
      background-color: #20c997;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .btn-submit:hover,
    .btn-menu:hover {
      background-color: #1ba87e;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <button class="btn-back" id="btn-volver">← Volver</button>
      <h2 class="title">Registro RPE</h2>
    </div>
    
    <form id="form-rpe">
      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre (User)</label>
        <input type="text" id="nombre" readonly required placeholder="Cargando jugador...">
      </div>

      <div class="form-group">
        <label for="equiposel">Equipo</label>
        <select id="equiposel" required>
          <option value="TERCERA">TERCERA</option>
          <option value="Junior A">Junior A</option>
          <option value="Junior B">Junior B</option>
          <option value="Cadete A">Cadete A</option>
          <option value="Cadete B">Cadete B</option>
          <option value="Infantil A">Infantil A</option>
          <option value="Infantil B">Infantil B</option>
        </select>
      </div>

      <div class="form-group">
        <label for="entrenamiento">Entrenamiento</label>
        <select id="entrenamiento" required>
          <option value="Pista">Pista</option>
          <option value="Físico">Físico</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rpe">RPE (0-10)</label>
        <div class="rpe-container">
          <input type="range" id="rpe" class="rpe-slider" min="0" max="10" value="5">
          <span id="rpe-val" class="rpe-value">5</span>
        </div>
      </div>

      <div class="form-group">
        <label for="estatus">Estatus</label>
        <select id="estatus" required>
          <option value="Completo" selected>Completo</option>
          <option value="Ausente">Ausente</option>
          <option value="Limitado">Limitado</option>
          <option value="Lesionado">Lesionado</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" rows="3" placeholder="Observaciones..."></textarea>
      </div>

      <div class="actions-container">
        <button type="submit" class="btn-submit">Enviar</button>
        <a href="menu_principal.html" class="btn-menu" id="btn-menu">Menú</a>
      </div>
    </form>
  </div>

  <script src="rpe.js" defer></script>
</body>
</html>
