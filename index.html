<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach RVB</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <!-- CSS versionado -->
  <link rel="stylesheet" href="style.css?v=2" />
  
  <!-- JS versionado con 'defer' para ejecutar tras cargar el HTML -->
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <div class="main-container">
    <img src="cbc.png" alt="Logo" class="app-logo" />

    <form id="loginForm" class="login-form">
      <label for="campoTexto">Usuario</label>
      <input type="text" id="campoTexto" autocomplete="username" required />

      <label for="campoPassword">Contraseña</label>
      <input type="password" id="campoPassword" autocomplete="current-password" required />

      <div class="checkbox-container">
        <input type="checkbox" id="casillaVerificacion" />
        <label for="casillaVerificacion">Recuérdame</label>
      </div>

      <button type="submit" id="btnEnviar">Enviar</button>
    </form>
  </div>
</body>
</html>
