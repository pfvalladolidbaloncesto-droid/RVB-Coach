<!DOCTYPE html>
<html lang="es">
<head>
  <script src="sesion_guard.js?v=1"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga Jugador - Coach RVB</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link rel="stylesheet" href="style.css?v=3" />
  <script src="informes_api.js?v=21" defer></script>
  <script src="carga_jugador.js?v=22" defer></script>
  <style>
    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .actions-container button {
      flex: 1;
      margin-top: 0 !important;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }
    #btnEnviarCargaJugador {
      background-color: #20c997;
    }
    #btnEnviarCargaJugador:hover {
      background-color: #1ba87e;
    }
    #btnVolverSelector {
      background-color: #20c997 !important;
    }
    #btnVolverSelector:hover {
      background-color: #1ba87e !important;
    }

    .actions-container{display:flex;gap:10px;margin-top:15px}
    .actions-container button{flex:1;margin-top:0!important}
    .estado-informe{margin:12px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
    .panel-pdf{margin-top:18px;width:100%;border-top:1px solid #e1e7e9;padding-top:17px}
    .panel-pdf[hidden]{display:none!important}
    .panel-pdf h2{font-size:17px;text-align:left;margin-bottom:10px}
    .pdf-acciones{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .pdf-acciones a{flex:1;min-width:140px;padding:12px;border-radius:9px;background:#20c997;color:#fff;text-decoration:none;text-align:center;font-size:14px;font-weight:700}
    .pdf-acciones a.descargar{background:#42658b}
    .aviso-pdf{font-size:12px;color:#697988;line-height:1.4;margin-top:8px;text-align:left}
    @media(max-width:600px){body{align-items:flex-start;padding:8px}.main-container.vista-abierta{padding:12px}}

  </style>
</head>
<body>
  <div class="main-container menu-container" id="contenedorCargaJugador">
    <header class="user-header">
      <span id="etiquetaTitulo" class="user-name">Carga Jugador</span>
    </header>

    <main class="menu-content">
      <!-- Equipo Seleccionado -->
      <div class="form-group">
        <label>Equipo</label>
        <input type="text" id="inputEquipo" class="input-text" disabled />
      </div>

      <!-- Jugador Seleccionado -->
      <div class="form-group">
        <label>Jugador</label>
        <input type="text" id="inputJugador" class="input-text" disabled />
      </div>

      <!-- Selector de Fecha -->
      <div class="form-group">
        <label for="inputFecha">Fecha</label>
        <input type="date" id="inputFecha" class="input-date" />
      </div>

      <!-- Contenedor para los botones en paralelo -->
      <div class="actions-container">
        <button type="button" id="btnEnviarCargaJugador" class="btn-action">Ver informe</button>
        <button id="btnVolverSelector" class="btn-logout">Menú</button>
      </div>

      <p id="estadoCargaJugador" class="estado-informe" role="status" aria-live="polite"></p>
      <section id="panelEnlaceJugador" class="panel-pdf" hidden>
        <h2>Informe del jugador preparado</h2>
        <div class="pdf-acciones">
          <a id="enlacePdfJugadorManual" href="#" target="_blank" rel="noopener noreferrer">Abrir PDF en el navegador</a>
        </div>
        <p class="aviso-pdf">El informe se abre en una pestaña normal, como en App Inventor. Puedes guardarlo desde el visor PDF de Chrome.</p>
      </section>
    </main>
  </div>
</body>
</html>
