<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga Jugador - Coach RVB</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link rel="stylesheet" href="style.css?v=3" />
  <script src="carga_jugador.js?v=3" defer></script>
  <style>
    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .actions-container button {
      flex: 1;
      margin-top: 0 !important;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }
    #btnEnviarCargaJugador {
      background-color: #20c997;
    }
    #btnEnviarCargaJugador:hover {
      background-color: #1ba87e;
    }
    #btnVolverSelector {
      background-color: #20c997 !important;
    }
    #btnVolverSelector:hover {
      background-color: #1ba87e !important;
    }
  </style>
</head>
<body>
  <div class="main-container menu-container">
    <header class="user-header">
      <span id="etiquetaTitulo" class="user-name">Carga Jugador</span>
    </header>

    <main class="menu-content">
      <!-- Equipo Seleccionado -->
      <div class="form-group">
        <label>Equipo</label>
        <input type="text" id="inputEquipo" class="input-text" disabled />
      </div>

      <!-- Jugador Seleccionado -->
      <div class="form-group">
        <label>Jugador</label>
        <input type="text" id="inputJugador" class="input-text" disabled />
      </div>

      <!-- Selector de Fecha -->
      <div class="form-group">
        <label for="inputFecha">Fecha</label>
        <input type="date" id="inputFecha" class="input-date" />
      </div>

      <!-- Contenedor para los botones en paralelo -->
      <div class="actions-container">
        <button id="btnEnviarCargaJugador" class="btn-action">Enviar</button>
        <button id="btnVolverSelector" class="btn-logout">Menú</button>
      </div>
    </main>
  </div>
</body>
</html>
