<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Jugadores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container selector-container">
    <div class="selector-header">
      <button class="btn-volver" id="btn-volver">← Volver</button>
      <h2 id="nombre-equipo">Cargando...</h2>
    </div>

    <!-- EL GRID DEBE QUEDAR AQUÍ ADENTRO CON ANCHO COMPLETO -->
    <div id="grid-jugadores">
      <!-- Indicador de carga estático para evitar saltos visuales -->
      <p class="cargando-texto">Cargando plantilla...</p>
    </div>
  </div>

  <script src="selector.js"></script>
</body>
</html>
