
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Test - Coach RVB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f3f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      width: 100%;
      max-width: 420px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn-back {
      background-color: #20c997;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-back:hover {
      background-color: #1ba87e;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      color: #000000;
      text-align: right;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      min-width: 0;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
      transition: border-color 0.2s,
                  box-shadow 0.2s;
    }

    .form-group input:read-only {
      background-color: #f8f9fa;
      color: #6c757d;
      cursor: not-allowed;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 3px
        rgba(32, 201, 151, 0.1);
    }

    .test-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 115px;
      gap: 10px;
    }

    .test-row select {
      width: 100%;
    }

    .help-text {
      margin-top: 6px;
      font-size: 12px;
      color: #6c757d;
      line-height: 1.5;
    }

    .sync-status {
      margin-top: 8px;
      font-size: 12px;
      color: #667785;
      line-height: 1.4;
    }

    .sync-status.error {
      color: #ac493b;
    }

    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit,
    .btn-menu {
      flex: 1;
      padding: 13px;
      background-color: #20c997;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .btn-submit:hover,
    .btn-menu:hover {
      background-color: #1ba87e;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="header-bar">
      <button
        type="button"
        class="btn-back"
        id="btn-volver"
      >
        ← Volver
      </button>

      <h2 class="title">Registrar Test</h2>
    </div>

    <form id="form-registrar-test">

      <!-- JUGADOR -->
      <div class="form-group">
        <label for="nombre">Usuario</label>

        <input
          type="text"
          id="nombre"
          readonly
          required
          placeholder="Cargando usuario..."
        >
      </div>

      <!-- FECHA -->
      <div class="form-group">
        <label for="fecha">Fecha</label>

        <input
          type="date"
          id="fecha"
          required
        >
      </div>

      <!-- SELECTORES -->
      <div class="form-group">

        <label for="test">Test</label>

        <div class="test-row">

          <select id="test">
            <option value="" selected>
              Selecciona un test...
            </option>
          </select>

          <select id="lateralidad">
            <option value="" selected>
              —
            </option>

            <option value="IZQ">IZQ</option>
            <option value="DCH">DCH</option>
          </select>

        </div>

        <p
          class="sync-status"
          id="estado-tests"
          aria-live="polite"
        >
          Cargando tests del jugador...
        </p>

      </div>

      <!-- NUEVO CAMPO EDITABLE -->
      <div class="form-group">

        <label for="testRefinado">
          Test refinado
        </label>

        <input
          type="text"
          id="testRefinado"
          required
          autocomplete="off"
          placeholder="Ej.: ANKLEIZQ o NUEVOTEST"
        >

        <p class="help-text">
          Se completa automáticamente con los
          selectores, pero puedes modificarlo
          o escribir un test nuevo.
          Este será el valor utilizado al registrar.
        </p>

      </div>

      <!-- RESULTADO -->
      <div class="form-group">

        <label for="resultado">Resultado</label>

        <input
          type="number"
          id="resultado"
          step="any"
          required
          placeholder="Ingresa el resultado"
        >

      </div>

      <!-- BOTONES -->
      <div class="actions-container">

        <button
          type="submit"
          class="btn-submit"
          id="btn-registrar"
        >
          Registrar
        </button>

        <a
          href="menu_principal.html"
          class="btn-menu"
          id="btn-menu"
        >
          Menú
        </a>

      </div>

    </form>

  </div>

  <script src="registrar_test.js?v=2" defer></script>

</body>
</html>
