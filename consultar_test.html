<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Consulta de Test</h1>
        <p>Usuario: <span id="Nombre">Cargando...</span></p>

        <div class="selectors-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div class="form-group" style="flex: 1;">
                <label for="test">Seleccione el Test:</label>
                <select id="test">
                    <option value="">Seleccione...</option>
                </select>
            </div>

            <div class="form-group" style="flex: 1;" id="group-lateralidad">
                <label for="lateralidad">Lateralidad:</label>
                <select id="lateralidad" disabled>
                    <option value="">Seleccione...</option>
                    <option value="IZQ">IZQ</option>
                    <option value="DCH">DCH</option>
                </select>
            </div>
        </div>

        <p>Resultado combinado: <span id="Resultado"></span></p>

        <button id="Enviar">Enviar Consulta</button>

        <div class="results-container" style="margin-top: 20px; display: grid; gap: 10px;">
            <div>
                <label>Valor Último:</label>
                <input type="text" id="CampoDeTexto1" readonly>
            </div>
            <div>
                <label>Fecha Último:</label>
                <input type="text" id="CampoDeTexto2" readonly>
            </div>
            <div>
                <label>Valor Mejor:</label>
                <input type="text" id="CampoDeTexto3" readonly>
            </div>
            <div>
                <label>Fecha Mejor:</label>
                <input type="text" id="CampoDeTexto4" readonly>
            </div>
        </div>
    </div>

    <script src="consultar_test.js"></script>
</body>
</html>
