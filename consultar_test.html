<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Test - Coach RVB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f3f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #test-container {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #Nombre {
      font-size: 20px;
      font-weight: 800;
      color: #000000;
      margin-bottom: 5px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      margin-top: 5px;
    }

    select, input {
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 3px rgba(32, 201, 151, 0.1);
    }

    input[readonly] {
      background-color: #f8f9fa;
      color: #6c757d;
      cursor: not-allowed;
    }

    .test-row {
      display: flex;
      gap: 10px;
    }

    .test-row select {
      flex: 1;
    }

    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-consultar,
    .btn-menu {
      flex: 1;
      padding: 13px;
      background-color: #20c997;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }

    .btn-consultar:hover,
    .btn-menu:hover {
      background-color: #1ba87e;
    }
  </style>
</head>
<body>

<div id="test-container">
  <span id="Nombre">Atleta no definido</span>
  
  <div class="test-row">
    <select id="test-select" required>
      <option value="SLR">SLR</option>
      <option value="ANKLE">ANKLE</option>
      <option value="DJ">DJ</option>
      <option value="CMJ">CMJ</option>
      <option value="SJ">SJ</option>
      <option value="30-15">30-15</option>
      <option value="PESO">PESO</option>
      <option value="ENVERGADURA">ENVERGADURA</option>
      <option value="ALTURA">ALTURA</option>
    </select>

    <select id="lateralidad-select" disabled>
      <option value="" disabled selected>Lateralidad</option>
      <option value="IZQ">IZQ</option>
      <option value="DCH">DCH</option>
    </select>
  </div>

  <label for="CampoDeTexto1">Valor último</label>
  <input type="text" id="CampoDeTexto1" readonly>

  <label for="CampoDeTexto2">Fecha último</label>
  <input type="text" id="CampoDeTexto2" readonly>

  <label for="CampoDeTexto3">Valor mejor</label>
  <input type="text" id="CampoDeTexto3" readonly>

  <label for="CampoDeTexto4">Fecha mejor</label>
  <input type="text" id="CampoDeTexto4" readonly>

  <div class="actions-container">
    <button id="Enviar" class="btn-consultar">Consultar</button>
    <a href="menu_principal.html" class="btn-menu" id="btn-menu">Menú</a>
  </div>
</div>

<!-- Enlace al archivo JavaScript externo -->
<script src="consultar_test.js" defer></script>

</body>
</html>
