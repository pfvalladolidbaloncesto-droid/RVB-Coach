<!DOCTYPE html>
<html lang="es">
<head>
  <script src="sesion_guard.js?v=1"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga - Coach RVB</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link rel="stylesheet" href="style.css?v=3" />
  <script src="informes_api.js?v=6" defer></script>
  <script src="carga.js?v=6" defer></script>
  <style>
    .actions-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .actions-container button {
      flex: 1;
      margin-top: 0 !important;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }
    #btnEnviarCarga {
      background-color: #20c997;
    }
    #btnEnviarCarga:hover {
      background-color: #1ba87e;
    }
    #btnVolverMenu {
      background-color: #20c997;
    }
    #btnVolverMenu:hover {
      background-color: #1ba87e;
    }

    .actions-container{display:flex;gap:10px;margin-top:15px}
    .actions-container button{flex:1;margin-top:0!important}
    .estado-informe{margin:12px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
    .main-container.vista-abierta{max-width:1000px;width:min(100%,1000px)}
    .main-container.vista-abierta .menu-content{width:100%}
    .panel-pdf{margin-top:18px;width:100%;border-top:1px solid #e1e7e9;padding-top:17px}
    .panel-pdf[hidden]{display:none!important}
    .panel-pdf h2{font-size:17px;text-align:left;margin-bottom:10px}
    .pdf-acciones{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .pdf-acciones a{flex:1;min-width:140px;padding:12px;border-radius:9px;background:#20c997;color:#fff;text-decoration:none;text-align:center;font-size:14px;font-weight:700}
    .pdf-acciones a.descargar{background:#42658b}
    .visor-pdf{width:100%;height:72vh;min-height:440px;border:1px solid #d6dee5;border-radius:9px;background:#f4f7f9}
    .aviso-pdf{font-size:12px;color:#697988;line-height:1.4;margin-top:8px;text-align:left}
    @media(max-width:600px){body{align-items:flex-start;padding:8px}.main-container.vista-abierta{padding:12px}.visor-pdf{height:67vh;min-height:380px}}

  </style>
</head>
<body>
  <div class="main-container menu-container" id="contenedorCargaEquipo">
    <header class="user-header">
      <span id="etiquetaTitulo" class="user-name">Cargando...</span>
    </header>

    <main class="menu-content">
      <!-- Selección de Equipo -->
      <div class="form-group">
        <label for="selectorEquipoCarga">Equipo</label>
        <select id="selectorEquipoCarga">
          <option value="Infantil B">Infantil B</option>
          <option value="Infantil A">Infantil A</option>
          <option value="Cadete B">Cadete B</option>
          <option value="Cadete A">Cadete A</option>
          <option value="Junior B">Junior B</option>
          <option value="Junior A">Junior A</option>
          <option value="Filial">Filial</option>
          <option value="Desarrollo">Desarrollo</option>
          <option value="Primer Equipo">Primer Equipo</option>
        </select>
      </div>

      <!-- Campo de texto para Usuario (Solo visible si es Carga Jugador) -->
      <div class="form-group" id="grupoTextBox">
        <label for="inputUsuarioCarga">Jugador / Usuario</label>
        <input type="text" id="inputUsuarioCarga" class="input-text" placeholder="Nombre de usuario" />
      </div>

      <!-- Selector de Fecha -->
      <div class="form-group">
        <label for="inputFecha">Fecha</label>
        <input type="date" id="inputFecha" class="input-date" />
      </div>

      <!-- Contenedor para los botones en paralelo -->
      <div class="actions-container">
        <button type="button" id="btnEnviarCarga" class="btn-action">Ver informe</button>
        <button id="btnVolverMenu" class="btn-logout">Menú</button>
      </div>

      <p id="estadoCargaEquipo" class="estado-informe" role="status" aria-live="polite"></p>

      <section id="panelPdfEquipo" class="panel-pdf" hidden>
        <h2>Informe preparado</h2>
        <div class="pdf-acciones">
          <a id="abrirPdfEquipo" href="#" target="_blank" rel="noopener noreferrer">Abrir PDF</a>
          <a id="descargarPdfEquipo" class="descargar" href="#" target="_blank" rel="noopener noreferrer">Descargar PDF</a>
        </div>
        <iframe id="vistaPdfEquipo" class="visor-pdf" title="Vista previa del informe PDF" hidden></iframe>
        <p class="aviso-pdf">El PDF de equipo lo genera Apps Script con la hoja «Informe equipo». Si el visor integrado no funciona en tu móvil, pulsa «Abrir PDF»; «Descargar PDF» guarda el mismo documento generado.</p>
      </section>
    </main>
  </div>
</body>
</html>
