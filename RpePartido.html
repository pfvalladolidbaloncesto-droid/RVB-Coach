<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPE Partido - Coach RVB</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  
  <link rel="stylesheet" href="style.css?v=3" />
  <style>
    .user-header {
      background-color: #3b82f6;
      color: white;
      padding: 12px 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .date-container {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .date-container input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .grid-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .grid-row {
      display: grid;
      grid-template-columns: 50px 1fr 80px 120px 1fr;
      gap: 8px;
      align-items: center;
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }

    .grid-row.disabled {
      opacity: 0.5;
      background: #f3f4f6;
    }

    .grid-row input, .grid-row select {
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-action {
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      padding: 12px;
      width: 100%;
    }

    .btn-action:hover {
      background-color: #059669;
    }

    .btn-back {
      background-color: #6b7280;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
    }

    .btn-back:hover {
      background-color: #4b5563;
    }
  </style>
  <script src="RpePartido.js?v=3" defer></script>
</head>
<body>
  <div class="main-container menu-container">
    <header class="user-header">
      <span id="etiquetaUsuario" class="user-name">Cargando...</span>
    </header>

    <main class="menu-content">
      <!-- Selector de Fecha -->
      <div class="date-container">
        <label for="inputFecha">Fecha del Partido</label>
        <input type="date" id="inputFecha" class="form-control" />
      </div>

      <!-- Grid de 5 columnas -->
      <div id="gridContainer" class="grid-table">
        <!-- Generado dinámicamente -->
      </div>

      <button id="btnGuardar" class="btn-action">Enviar RPE partido</button>
      <button id="btnVolver" class="btn-back">Volver al Menú</button>
    </main>
  </div>
</body>
</html>
